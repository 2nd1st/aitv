name = "aitv"
main = "src/worker.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "aitv.qiaomu.ai", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

