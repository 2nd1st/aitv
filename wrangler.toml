name = "aitv"
main = "src/worker.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "aitv.qiaomu.ai", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/audio/*", "/img/*"]

# 节目单指针和各版本 seed 放 KV；音频放 R2（支持 Range）
[[kv_namespaces]]
binding = "SCHEDULE"
id = "35456d05bca74c6390acb8af52f0ef89"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "aitv-audio"

# 以后：每 15 分钟跑一次流水线
# [triggers]
# crons = ["*/15 * * * *"]
