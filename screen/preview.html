<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 今天 · 画面预览</title>
<link rel="stylesheet" href="./tv.css">
</head>
<body>
<div id="root"></div>
<script type="module">
import { createTV } from "./tv.js";
// 读本地存的一份节目单快照（_sched.json，不进仓库）。没有就提示。
const s = await fetch("./_sched.json").then((r) => r.json()).catch(() => ({ items: [] }));
const items = s.items;
const q = new URLSearchParams(location.search);
// ?shot=1：截图用，关掉过渡，让无头浏览器拍到最终画面
if (q.get("shot") === "1") document.head.append(Object.assign(document.createElement("style"), { textContent: "*{transition:none!important}" }));
const mode = q.get("mode") === "program" ? "program" : "live";
const fI = q.has("i") ? +q.get("i") : null, fT = q.has("t") ? +q.get("t") : 0;
const total = items.reduce((a, b) => a + b.duration, 0);
let paused = false, frozen = null;
const tv = createTV(document.getElementById("root"), {
  onListen: () => {},
  onScreenClick: () => { if (paused) { paused = false; tv.setPaused(false); } else { paused = true; frozen = at(Date.now()); tv.setPaused(true); } },
  onGoLive: () => { paused = false; tv.setPaused(false); },
});
function locate(now) {
  let pos = ((now / 1000) % total + total) % total;
  for (let i = 0; i < items.length; i++) { if (pos < items[i].duration) return { i, t: pos }; pos -= items[i].duration; }
  return { i: 0, t: 0 };
}
const at = (now) => fI != null ? { i: fI, t: fT } : locate(now);
const up = (i) => [1, 2, 3, 4].map((k) => items[(i + k) % items.length]).map((x) => ({ title: x.fields.title_zh || x.fields.title, source: x.source }));
if (q.get("listen") === "1") tv.setMuted(false);
if (q.get("paused") === "1") { tv.setMuted(false); paused = true; tv.setPaused(true); frozen = at(Date.now()); }
(function frame() {
  const now = Date.now();
  const p = paused ? frozen : at(now);
  tv.render(items[p.i], p.t, now, { mode, episode: "早间 · 10月9日", index: p.i, count: items.length, upcoming: up(p.i) });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
